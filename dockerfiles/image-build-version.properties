# An image-only counter. Bump it (v1 -> v2) to rebuild the image from unchanged
# jars, and dispatch the job with BUILD_IMAGE_ONLY=true so the maven half is skipped.
# A change to hive source gets a new hive version instead (4.1.0.0 -> 4.1.0.1, mvn
# versions:set, reset to v1): the maven coordinate is mutable in nexus, and consumers
# -- trino-hive-apache, trino, hopsworks-ee -- pin it exactly.
IMAGE_BUILD_VERSION=v1
